<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e3c"/>
      <stop offset="100%" stop-color="#0d2545"/>
    </linearGradient>
    <linearGradient id="shark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee8d0"/>
      <stop offset="100%" stop-color="#22bfb0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a6fb5"/>
      <stop offset="100%" stop-color="#0e4d8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4eccca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4eccca" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="100" cy="100" r="96" fill="url(#glow)"/>
  <!-- Ocean wave bottom -->
  <ellipse cx="100" cy="155" rx="96" ry="40" fill="url(#wave)" clip-path="url(#circle-clip)"/>
  <ellipse cx="100" cy="148" rx="96" ry="32" fill="#1a6fb5" opacity="0.5" clip-path="url(#circle-clip)"/>
  <!-- Shark body -->
  <g transform="translate(100,88) scale(1.1)">
    <!-- Main body -->
    <ellipse cx="0" cy="0" rx="38" ry="20" fill="url(#shark)" transform="rotate(-8)"/>
    <!-- Tail -->
    <polygon points="-38,-8 -55,-24 -52,0 -55,20 -38,10" fill="#3dd4c0"/>
    <!-- Dorsal fin -->
    <polygon points="-5,-20 10,-48 22,-20" fill="url(#shark)"/>
    <!-- Pectoral fin -->
    <polygon points="8,4 28,22 14,8" fill="#3dd4c0"/>
    <!-- Eye -->
    <circle cx="28" cy="-4" r="4" fill="#fff"/>
    <circle cx="29" cy="-4" r="2.5" fill="#1a2a4a"/>
    <circle cx="30" cy="-5" r="1" fill="#fff"/>
    <!-- Smile -->
    <path d="M 14,8 Q 22,14 30,8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Teeth -->
    <polygon points="17,9 20,14 23,9" fill="#fff" opacity="0.9"/>
    <polygon points="22,10 25,15 28,10" fill="#fff" opacity="0.9"/>
    <!-- Jaw line -->
    <path d="M 14,5 Q 22,11 30,5" stroke="#0a4060" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  <!-- Bubbles -->
  <circle cx="148" cy="80" r="3" fill="#4eccca" opacity="0.6"/>
  <circle cx="158" cy="68" r="2" fill="#4eccca" opacity="0.4"/>
  <circle cx="143" cy="62" r="1.5" fill="#4eccca" opacity="0.5"/>
  <!-- Border ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#4eccca" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4eccca" stroke-width="0.5" opacity="0.2"/>
  <!-- DentalShark text -->
  <text x="100" y="178" font-family="'Arial Black',sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">Dental<tspan fill="#4eccca">Shark</tspan></text>
</svg>
